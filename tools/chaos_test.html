<!doctype html>
<meta charset="utf-8">
<title>Chaos-Balancetest</title>
<pre id="out">läuft …</pre>
<script type="module">
// Balancetest (nur Entwicklung): ein Bot spielt den Chaos-Modus (endlose Wellen mit wechselnden Gegner-Typen).
// Aufruf im Dev-Server: http://localhost:5190/tools/chaos_test.html?n=30   (&cfg={"chaos.flow.bigEvery":25} überschreibt Werte)
import { loadConfig, CFG } from '/src/config.js';
import { Defense } from '/src/game/defense.js';
await loadConfig();
const qs = new URLSearchParams(location.search);
for (const [k, v] of Object.entries(JSON.parse(qs.get('cfg') || '{}'))) { const p = k.split('.'); let o = CFG.defense; while (p.length > 1) o = o[p.shift()]; o[p[0]] = v; }
const N = +(qs.get('n') || 30), G = CFG.defense.grid;
// Bot: Bälle einsammeln, Weiterentwicklungen aufsetzen, sonst in die meistbedrohte Spalte, Statusangreifer auch an die Seite
function bot(g, stats) {
  for (const d of [...g.drops]) if (g.t - d.born > 0.6) g.collect(d);
  for (const c of [...g.cards]) { const u = g.units.find((x) => g.canUpgrade(c, x)); if (u && g.upgrade(c, u)) stats.up++; }
  const threat = Array.from({ length: G.cols }, (_, c) => g.enemies.filter((e) => e.hp > 0 && e.col === c).length);
  const attackers = (c) => g.units.filter((u) => u.col === c && u.hp > 0 && u.role !== 'mauer').length;
  const tryAt = (card, col, rows) => { for (const r of rows) if (g.place(card, col, r)) return true; return false; };
  for (const card of [...g.cards]) {
    const ab = CFG.defense.abilities[card.dex];
    if (ab && (ab.type === 'sleep' || ab.type === 'confuse')) { if (tryAt(card, Math.random() < 0.5 ? -1 : G.cols, [4, 5, 3, 6, 7, 2, 8])) { stats.side++; continue; } }
    const cols = [...Array(G.cols).keys()].sort((a, b) => (threat[b] - attackers(b) * 0.7) - (threat[a] - attackers(a) * 0.7));
    const c = threat[cols[0]] > 0 ? cols[0] : [...Array(G.cols).keys()].sort((a, b) => attackers(a) - attackers(b))[0];
    const rows = card.role === 'mauer' ? [3, 4, 5] : card.role === 'explosiv' ? [4, 5, 3] : card.role === 'nahkampf' ? [5, 4, 6, 7] : [7, 6, 8, 5, 4];
    if (!tryAt(card, c, rows)) for (let k = 0; k < G.cols && !tryAt(card, k, rows); k++);
  }
}
function run(level, seed) {
  const g = new Defense({ team: [], level, seed, chaos: true });
  const stats = { up: 0, side: 0, lives: 0 };
  let i = 0;
  while (!g.over && g.t < 1500) {
    if (i++ % 10 === 0) bot(g, stats);
    g.update(0.05);
    for (const ev of g.events) if (ev.type === 'lifeLost') stats.lives++;
    g.events.length = 0;
  }
  return { g, stats };
}
const out = [];
{
  const lv = { n: 0, chaos: true, types: [...CFG.defense.themes.types], enemyLevel: CFG.defense.chaos.endless.baseLevel, countMult: CFG.defense.chaos.countMult, finalStage: 3, waves: 0 };
  const res = [];
  let time = 0;
  for (let k = 0; k < N; k++) { const { g } = run(lv, 900 + k); res.push(g.wave + 1); time += g.t; }
  res.sort((a, b) => a - b);
  out.push(`Chaos: Ø Welle ${(res.reduce((a, b) => a + b, 0) / N).toFixed(1)} · Median ${res[Math.floor(N / 2)]} · min ${res[0]} · max ${res[N - 1]} · Ø Dauer ${(time / N / 60).toFixed(1)} min`);
}
document.getElementById('out').textContent = out.join('\n');
window.done = out;
</script>
