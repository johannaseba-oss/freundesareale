<!doctype html>
<meta charset="utf-8">
<title>Kampf-Balancetest</title>
<pre id="out">läuft …</pre>
<script type="module">
// Balancetest (nur Entwicklung): simuliert Kämpfe ohne Oberfläche, beide Seiten von der KI gespielt.
// Aufruf im Dev-Server: http://localhost:5190/tools/battle_test.html   (?n=100 = Anzahl Kämpfe)
// 1) Fairness: zwei Zufallsteams (Seltenheit wie am Automaten), gleiche KI auf beiden Seiten.
// 2) Schwierigkeit: Zufallsteam mit mittlerer KI gegen jeden Computergegner.
import { loadConfig, CFG } from '/src/config.js';
import { Battle, fromCpu, calcStats, canBattle } from '/src/game/battle.js';
import { mulberry32 } from '/src/rng.js';
await loadConfig();
// ?cfg={"tower.hpMultiplier":5} überschreibt Werte aus battle.json nur für diesen Test
const over = JSON.parse(new URLSearchParams(location.search).get('cfg') || '{}');
for (const [k, v] of Object.entries(over)) { const p = k.split('.'); let o = CFG.battle; while (p.length > 1) o = o[p.shift()]; o[p[0]] = v; }
const SKIP2 = new URLSearchParams(location.search).has('nodiff');
const N = +(new URLSearchParams(location.search).get('n') || 100);
const B = CFG.battle, MAX_T = 10 * 60;
const rnd = mulberry32(42);
const byRarity = {};
for (const p of CFG.dex) if (canBattle(p.dex)) (byRarity[p.rarity] ||= []).push(p.dex);
const balls = CFG.balance.gacha.balls;
function randomDex() {
  let r = rnd() * balls.reduce((s, b) => s + b.weight, 0);
  const ball = balls.find((b) => (r -= b.weight) < 0) || balls[0];
  const list = byRarity[ball.rarity];
  return list[Math.floor(rnd() * list.length)];
}
// Zufallsteam wie ein Spieler: 10 Pokémon, die drei mit den besten Abwehrwerten werden Verteidiger (wie die Empfehlung)
function randomTeam(id) {
  const prof = { id, ivs: [0, 31], evs: 0 };
  const srcs = Array.from({ length: B.teamSize }, (_, i) => fromCpu(randomDex(), prof, i));
  const def = (s) => { const st = calcStats(s.dex, B.startLevel, s.ivs, s.evs); return st[0] + st[2] + st[4]; };
  const sorted = [...srcs].sort((a, b) => def(b) - def(a));
  const towers = sorted.slice(0, B.towerCount);
  return { towers, team: srcs.filter((s) => !towers.includes(s)), bst: srcs.reduce((s, x) => s + CFG.battleData.pokemon[x.dex].base.reduce((a, b) => a + b, 0), 0) };
}
const stale = { n: 0, lv: 0, hp: 0, k: 0, field: 0, down: 0 };
const MID = { id: 'mid', think: 2.3, aggression: 0.45 };
function run(player, cpu, opponent, seed) {
  const b = new Battle({ player, cpu, opponent, seed, playerAi: MID });
  while (!b.over && b.t < MAX_T) b.update(0.05);
  if (!b.over) { stale.n++; for (const t of [...b.sides.p.towers, ...b.sides.c.towers]) { stale.lv += t.level; stale.hp += t.hp / t.maxHp; stale.k++; } stale.field += b.activeCount('p') + b.activeCount('c'); stale.down += b.sides.p.towers.filter((t) => t.hp <= 0).length + b.sides.c.towers.filter((t) => t.hp <= 0).length; }
  return { winner: b.over?.winner || null, t: b.t, downP: b.sides.p.towers.filter((t) => t.hp <= 0).length, downC: b.sides.c.towers.filter((t) => t.hp <= 0).length };
}
const out = [];
const show = () => { document.getElementById('out').textContent = out.join('\n'); };
const tick = () => new Promise((r) => setTimeout(r));

// 1) Fairness
if (!new URLSearchParams(location.search).has('nofair')) {
let wp = 0, wc = 0, draw = 0, time = 0, strongerWins = 0, decided = 0, loserTowers = 0;
const durs = [];
for (let k = 0; k < N; k++) {
  const A = randomTeam('a' + k), Bt = randomTeam('b' + k);
  const r = run(A, Bt, { ...MID, id: 'b' + k }, 7000 + k);
  if (r.winner === 'p') wp++; else if (r.winner === 'c') wc++; else draw++;
  if (r.winner) { decided++; if ((r.winner === 'p') === (A.bst >= Bt.bst)) strongerWins++; loserTowers += r.winner === 'p' ? r.downP : r.downC; durs.push(r.t); }
  time += r.t;
  if (k % 10 === 9) { out[0] = `Fairness ${k + 1}/${N} …`; show(); await tick(); }
}
durs.sort((a, b) => a - b);
out[0] = `=== Fairness: ${N} Kämpfe, Zufallsteams, gleiche KI ===`;
out.push(`Siege unten ${wp} · oben ${wc} · unentschieden (>10 min) ${draw}`,
  `Dauer Ø ${(time / N / 60).toFixed(1)} min · Median ${(durs[durs.length >> 1] / 60 || 0).toFixed(1)} min`,
  `Stärkeres Team (Basiswert-Summe) gewinnt ${Math.round((100 * strongerWins) / Math.max(1, decided))} %`,
  `Verlierer schafft Ø ${(loserTowers / Math.max(1, decided)).toFixed(1)} gegnerische Verteidiger`,
  stale.n ? `Unentschieden: Verteidiger Ø Lv ${(stale.lv / stale.k).toFixed(1)}, Ø KP ${Math.round((100 * stale.hp) / stale.k)} %, Ø ${(stale.field / stale.n).toFixed(1)} Pokémon auf dem Feld, Ø ${(stale.down / stale.n).toFixed(1)} Verteidiger gefallen` : '');
if (SKIP2) { window.done = out; show(); throw 0; }
}
show(); await tick();

// 2) Schwierigkeit der Computergegner (Zufallsteam mit mittlerer KI)
out.push('', '=== Schwierigkeit (Zufallsteam vs. Gegner) ===');
const M = Math.max(10, Math.round(N / 4));
for (const o of B.opponents) {
  let w = 0, d = 0, t = 0, towers = 0;
  for (let k = 0; k < M; k++) {
    const me = randomTeam('m' + o.id + k);
    const cpu = { towers: o.towers.map((x, i) => fromCpu(x, o, i)), team: o.team.map((x, i) => fromCpu(x, o, i + 3)) };
    const r = run(me, cpu, o, 9000 + k);
    if (r.winner === 'p') w++; else if (!r.winner) d++;
    t += r.t; towers += r.downC;
  }
  out.push(`${o.level.padEnd(12)} Siegquote ${Math.round((100 * w) / M)} % · unentschieden ${d} · gegn. Verteidiger besiegt Ø ${(towers / M).toFixed(1)} · Dauer Ø ${(t / M / 60).toFixed(1)} min`);
  show(); await tick();
}
window.done = out;
</script>
